name: daily scan

# Manual fallback only. The daily run happens on the Mac mini (launchd, 06:30 JST,
# see run_mac.sh) because athome's bot check trips on datacenter IPs.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Scan athome
        env:
          TZ: Asia/Tokyo
        run: python3 scan.py
      - name: Commit ledger + diff
        run: |
          git config user.name "japan-houses-bot"
          git config user.email "robin@fromanother.love"
          git add ledger.json ledger_full.json tier1.json diff.md history/
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "scan $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
